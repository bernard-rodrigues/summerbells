<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schoolbell&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="./assets/images/frog.png" type="image/x-icon">
    <title>Summer Bells</title>
</head>
<body>
    <main>
        <div id="container">
            <div id="title">
                <h1>Summer Bells</h1>
                <h2>Frog Time</h2>
                <h3 id="height-record"></h3>
                <h3 id="bells-record"></h3>
                <p><b>Click</b> or press <b>space</b> to jump</p>
            </div>
            <div id="score">
                <div id="height-score"></div>
                <div id="bells-score"></div>
            </div>
            <div id="rabbit"></div>
            <div id="floor"></div>
        </div>
    </main>
    <script src="./script.js"></script>
</body>
</html>
